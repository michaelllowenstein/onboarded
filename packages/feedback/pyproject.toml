[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarded-feedback"
version = "0.1.0"
description = "Onboarded feedback loop — local telemetry, gap detection and domain suggestions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []                       # stdlib only (sqlite3)

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ob-feedback = "onboarded_feedback.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
